<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Training</title>
<style>
  /* tokens: see DESIGN.md (chalk + ink, one oxide accent) */
  :root {
    --bg: oklch(97.5% 0.008 75); --surface: oklch(99.3% 0.004 75); --ink: oklch(22% 0.015 50);
    --muted: oklch(47% 0.015 50); --line: oklch(89% 0.01 70);
    --accent: oklch(50% 0.15 35); --accent-ink: oklch(98% 0.01 75); --band: oklch(94.5% 0.022 55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(18% 0.01 50); --surface: oklch(22% 0.012 50); --ink: oklch(94% 0.01 75);
      --muted: oklch(72% 0.015 70); --line: oklch(31% 0.012 50);
      --accent: oklch(72% 0.14 40); --accent-ink: oklch(18% 0.01 50); --band: oklch(24% 0.025 45);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         -webkit-text-size-adjust: 100%; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* index tabs: the only sticky thing */
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line);
           padding-top: env(safe-area-inset-top); }
  .tabs { display: flex; }
  .tabs button { flex: 1; min-height: 48px; border: 0; border-bottom: 3px solid transparent; background: none;
                 font-size: 16px; font-weight: 600; color: var(--muted); position: relative;
                 transition: color .15s, border-color .15s; }
  .tabs button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tabs .today::after { content: ""; position: absolute; top: 9px; right: calc(50% - 20px);
                        width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-top: 16px;
         background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg[hidden] { display: none; }
  .seg button { border: 0; background: none; border-radius: 7px; min-height: 40px;
                font-size: 15px; font-weight: 550; color: var(--muted); transition: background-color .15s, color .15s; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  main { padding-bottom: 48px; }
  h1 { font-size: 30px; font-weight: 750; line-height: 1.1; letter-spacing: -.015em; margin: 24px 0 0; }
  .sub { color: var(--muted); font-size: 15px; margin: 6px 0 0; }
  h2 { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
       margin: 32px 0 4px; }
  .warm { font-size: 15px; margin: 16px 0 0; max-width: 62ch; }
  .warm b { font-weight: 650; }

  ol { list-style: none; margin: 0; padding: 0; }
  li.ex { display: grid; grid-template-columns: 2em 1fr auto; gap: 0 10px; padding: 14px 0;
          border-top: 1px solid var(--line); }
  li.ex:first-child, li.main + li.ex { border-top-color: transparent; }
  li.pair { border-top-style: dashed; }
  /* the day's 5/3/1 lift: one tinted band, bleeds to the screen edge */
  li.main { background: var(--band); border-top-color: transparent; margin: 0 -16px; padding: 16px; border-radius: 0; }
  @media (min-width: 712px) { li.main { border-radius: 12px; } }
  .n { font-size: 14px; font-weight: 650; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .what b { display: block; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .what small { display: block; color: var(--muted); font-size: 14px; margin-top: 3px; max-width: 58ch; }
  .dose { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .load { display: block; font-size: 19px; font-weight: 700; line-height: 1.3; }
  li.main .load { font-size: 21px; }
  .load.word { font-size: 14px; font-weight: 500; color: var(--muted); padding-top: 3px; }
  .sets { display: block; font-size: 16px; color: var(--muted); margin-top: 2px; }
  .skip { opacity: .45; }

  .notes li { padding: 10px 0; border-top: 1px solid var(--line); max-width: 68ch; }
  .notes li:first-child { border-top: 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; min-width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { font-weight: 600; color: var(--muted); }
  .empty { color: var(--muted); }
  footer { color: var(--muted); font-size: 14px; margin-top: 32px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header><nav class="wrap tabs" id="tabs" aria-label="Day"></nav></header>
<main class="wrap">
  <nav class="seg" id="weeks" aria-label="Week"></nav>
  <div id="view"><p class="sub">Loading…</p></div>
</main>
<script>
// 5/3/1: [set 1, set 2, top set] percent of TM and reps, per week (week 4 = deload)
const PCT  = [[.65,.75,.85], [.70,.80,.90], [.75,.85,.95], [.40,.50,.60]];
const REPS = [[5,5,5], [3,3,3], [5,3,1], [5,5,5]];
const down = x => Math.floor(x / 2.5 + 1e-9) * 2.5; // round down to a loadable plate
console.assert(down(115*.65) === 72.5 && down(95*.85) === 80 && down(115*.5) === 57.5, '5/3/1 rounding broke');

let data, week = +localStorage.week || 1, tab;
const isNum = v => typeof v === 'number' || /^[\d.×]+$/.test(v);
const loadHtml = v => v === undefined ? '' :
  isNum(v) ? `<span class="load">${v} kg</span>` : `<span class="load word">${v}</span>`;

// tm is either a number or a key into data.tm (one Training Max shared by the main sets and first-set-last)
const tmOf = it => typeof it.tm === 'string' ? data.tm[it.tm] : it.tm;

function dose(it, w) {
  if (it.tm && it.pct) { // supplemental sets off the TM, e.g. first set last
    const p = it.pct[w];
    return p ? loadHtml(down(tmOf(it) * p)) + `<span class="sets">${it.weeks[w]}</span>` : `<span class="sets">skip</span>`;
  }
  if (it.tm) { // 5/3/1 main sets; plus → top set of weeks 1–3 is a capped "+" set
    const tm = tmOf(it);
    return PCT[w].map((p, i) => `<span class="load">${down(tm * p)} × ${REPS[w][i]}${it.plus && w < 3 && i === 2 ? '+' : ''}</span>`).join('')
      + `<span class="sets">TM ${tm}</span>`;
  }
  const load = Array.isArray(it.kg) ? it.kg[w] : it.kg;
  return loadHtml(load) + (it.weeks ? `<span class="sets">${it.weeks[w]}</span>` : '');
}

// ⇄ in data.json = superset with the line above → numbered 3a / 3b like a paper program sheet
const isPair = it => it.name.toString().startsWith('⇄');
function list(items, w) {
  let n = 0;
  const labels = items.map(it => isPair(it) ? n + 'b' : ++n + '');
  return `<ol>${items.map((it, i) => {
    const raw = Array.isArray(it.name) ? it.name[w] : it.name, pair = isPair(it);
    const lab = labels[i] + (!pair && items[i + 1] && isPair(items[i + 1]) ? 'a' : '');
    const skip = (it.weeks && it.weeks[w] === 'skip') || (it.pct && !it.pct[w]);
    const main = it.tm && !it.pct;
    return `<li class="ex${pair ? ' pair' : ''}${main ? ' main' : ''}${skip ? ' skip' : ''}"><span class="n">${lab}</span>
      <div class="what"><b>${raw.replace(/^⇄\s*/, '')}</b>${it.note ? `<small>${it.note}</small>` : ''}</div>
      <div class="dose">${dose(it, w)}</div></li>`;
  }).join('')}</ol>`;
}

function dayView(d) {
  const w = week - 1, warm = d.items.find(it => /^warm-up/i.test(it.name));
  const items = d.items.filter(it => it !== warm);
  return `<h1>${d.day}</h1><p class="sub">${d.note || ''}</p>
    ${warm ? `<p class="warm"><b>Warm-up:</b> ${warm.name.replace(/^warm-up:\s*/i, '')}</p>` : ''}
    <h2>Session</h2>${list(items, w)}
    ${d.evening ? `<h2>Evening</h2>${list(d.evening, w)}` : ''}`;
}

function notesView() {
  const t = data.tests;
  const rows = t && (t.log.length ? t.log.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${t.columns.length}" class="empty">No entries yet</td></tr>`);
  return `<h1>${data.title}</h1><p class="sub">Updated ${data.updated}</p>
    <h2>Rules</h2><ol class="notes">${data.rules.map(r => `<li>${r}</li>`).join('')}</ol>
    ${t ? `<h2>Cycle tests</h2><p class="sub">${t.note}</p>
      <div class="scroll"><table><tr>${t.columns.map(c => `<th>${c}</th>`).join('')}</tr>${rows}</table></div>` : ''}
    <footer>Plan lives in <code>data.json</code>. <a href="v6/v6-calculator.html">Old v6 calculator</a></footer>`;
}

const slug = d => d.day.slice(0, 3).toLowerCase();
const DOW = ['sun','mon','tue','wed','thu','fri','sat'], today = DOW[new Date().getDay()];

// no hash → today's session, or the next one coming up
function defaultTab() {
  const t = DOW.indexOf(today);
  for (let k = 0; k < 7; k++) { const d = data.days.find(d => slug(d) === DOW[(t + k) % 7]); if (d) return slug(d); }
  return 'notes';
}

function render() {
  tab = location.hash.slice(1) || defaultTab();
  tabs.innerHTML = data.days.map(d => [slug(d), d.day.slice(0, 3)]).concat([['notes', 'Notes']])
    .map(([s, l]) => `<button data-t="${s}" aria-pressed="${s === tab}"${s === today ? ' class="today" aria-label="' + l + ' (today)"' : ''}>${l}</button>`).join('');
  const d = data.days.find(d => slug(d) === tab);
  weeks.hidden = !d;
  weeks.innerHTML = [1, 2, 3, 4].map(n =>
    `<button data-w="${n}" aria-pressed="${n === week}">${n === 4 ? 'Deload' : 'Week ' + n}</button>`).join('');
  view.innerHTML = d ? dayView(d) : notesView();
}

weeks.onclick = e => { const b = e.target.closest('button'); if (b) { week = +b.dataset.w; localStorage.week = week; render(); } };
tabs.onclick = e => { const b = e.target.closest('button'); if (b) { history.replaceState(null, '', '#' + b.dataset.t); render(); scrollTo(0, 0); } };
onhashchange = render;
fetch('data.json', { cache: 'no-cache' }).then(r => r.json()).then(d => { data = d; render(); })
  .catch(e => view.textContent = 'Could not load data.json: ' + e);
</script>
</body>
</html>
